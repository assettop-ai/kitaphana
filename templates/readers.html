<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Оқырмандар</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f2f2f2;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        th {
            background: #eeeeee;
        }
        .add {
            display: inline-block;
            padding: 12px 18px;
            background: white;
            text-decoration: none;
            color: black;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>ОҚЫРМАНДАР</h1>

    {% if session.get("role") == "librarian" %}
    <a class="add" href="/readers/add">+ ОҚЫРМАН ҚОСУ</a>
    <a class="add" href="/readers/import">📥 EXCEL-ДЕН ЖҮКТЕУ</a>
    {% endif %}

    <table>
        <tr>
            <th>ID</th>
            <th>Аты-жөні</th>
            <th>Сыныбы</th>
            <th>Түрі</th>
        </tr>

        {% for reader in readers %}
        <tr>
            <td>{{ reader["id"] }}</td>
            <td>{{ reader["aty"] }}</td>
            <td>{{ reader["synyp"] }}</td>
            <td>{{ reader["turi"] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">← Басты бет</a>
</body>
</html>
